<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Top Car Insurance Plans</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f7fd;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .card {
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 30px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      display: none;
    }

    .card.visible {
      display: block;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo-title {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .logo-title img {
      height: 40px;
    }

    .label {
      font-weight: bold;
      color: #444;
    }

    .value {
      font-weight: bold;
      color: #007bff;
    }

    .price-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 8px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .check-button {
      background-color: #ff4d58;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .features {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      color: #28a745;
      font-size: 14px;
    }

    .features div::before {
      content: "\2714";
      color: #28a745;
      margin-right: 8px;
    }

    .see-more {
      text-align: center;
      margin-top: 30px;
    }

    .see-more button {
      background-color: white;
      color: #007bff;
      padding: 10px 20px;
      border: 2px solid #007bff;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Top Car Insurance Plans</h2>

  <div id="plans-container"></div>

  <div class="see-more">
    <button onclick="showMorePlans()">See More Plans ▼</button>
  </div>

  <script>
    const plansData = [
      {
        name: "Hdfc Ergo Car Insurance",
        logo: "https://upload.wikimedia.org/wikipedia/commons/9/9f/HDFC_ERGO_logo.png",
        garages: "8000+",
        settled: "100%",
        claims: "UNLIMITED",
        price: "₹ 2881",
        features: ["Maximum Cashless Garages", "24x7 Roadside Assistance", "Over Night Vehicle Repairs", "Quick Claim Settlement"]
      },
      {
        name: "United India Car Insurance",
        logo: "https://upload.wikimedia.org/wikipedia/en/f/f6/United_India_Insurance_Company_Logo.png",
        garages: "3,100",
        settled: "95%",
        claims: "UNLIMITED",
        price: "₹ 2396",
        features: ["Towing Assistance (For Accidents)", "PSU Provider", "Coverage Outside India", "Quick Claim Settlement"]
      },
      {
        name: "Icici Lombard Car Insurance",
        logo: "https://logos-world.net/wp-content/uploads/2021/09/ICICI-Bank-Logo.png",
        garages: "6100+",
        settled: "96.75%",
        claims: "UNLIMITED",
        price: "₹ 1000",
        features: ["Towing Assistance (Till 50 kms)", "6-Month Repair Warranty", "Free Pick-Up and Drop", "Quick Claim Settlement"]
      },
      {
        name: "New India Car Insurance",
        logo: "https://companieslogo.com/img/orig/NEWINDIA.BO_BIG.D-00a5d81c.png",
        garages: "3,000",
        settled: "92%",
        claims: "UNLIMITED",
        price: "₹ 2494",
        features: ["Towing Assistance till Rs 1,500", "Coverage Outside India", "PSU Provider", "Quick Claim Settlement"]
      },
      {
        name: "Royal Sundaram Car Insurance",
        logo: "https://companieslogo.com/img/orig/ROYALSUND.BO_BIG.D-bc69d243.png",
        garages: "7600+",
        settled: "99%",
        claims: "UNLIMITED",
        price: "₹ 3151",
        features: ["Zero Depreciation till 7 years", "6-Month Repair Warranty", "Free Pick-Up and Drop", "Quick Claim Settlement"]
      },
      {
        name: "Future Generali Car Insurance",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/7/7d/Future_Generali_Logo.svg/2560px-Future_Generali_Logo.svg.png",
        garages: "3,500",
        settled: "96%",
        claims: "UNLIMITED",
        price: "₹ 2094",
        features: ["Towing Assistance (Accidents)", "Priority Car Repairs", "24x7 Roadside Assistance", "Quick Claim Settlement"]
      }
      // Add more plans here following the same structure...
    ];

    const plansContainer = document.getElementById("plans-container");
    let shownPlans = 0;

    function renderPlan(plan) {
      const card = document.createElement("div");
      card.className = "card visible";
      card.innerHTML = `
        <div class="top-section">
          <div class="logo-title">
            <img src="${plan.logo}" alt="Logo">
            <div><div class="label">${plan.name}</div></div>
          </div>
          <div><div class="label">Cashless Garages</div><div class="value">${plan.garages}</div></div>
          <div><div class="label">Claims Settled</div><div class="value">${plan.settled}</div></div>
          <div><div class="label">Comprehensive Claims</div><div class="value">${plan.claims}</div></div>
        </div>
        <div class="price-section">
          <div><div class="label">Starting From</div><div class="price">${plan.price}</div></div>
          <button class="check-button">Check Prices</button>
        </div>
        <div class="features">${plan.features.map(f => `<div>${f}</div>`).join('')}</div>
      `;
      plansContainer.appendChild(card);
    }

    function showMorePlans() {
      const next = plansData.slice(shownPlans, shownPlans + 2);
      next.forEach(renderPlan);
      shownPlans += next.length;
      if (shownPlans >= plansData.length) {
        document.querySelector('.see-more').style.display = 'none';
      }
    }

    // Load first 2 plans initially
    showMorePlans();
  </script>
</body>
</html>
