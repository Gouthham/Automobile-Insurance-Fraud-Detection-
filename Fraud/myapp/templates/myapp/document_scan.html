 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document Fraud Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function togglePoliceReportInput() {
      const checkbox = document.getElementById('has-police-report');
      const reportInputDiv = document.getElementById('police-report-section');
      reportInputDiv.style.display = checkbox.checked ? 'block' : 'none';
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-2xl bg-white rounded-xl shadow-md p-8 space-y-8">
    <h1 class="text-3xl font-bold text-center">Scan & Verify Document Authenticity</h1>

    <form
      id="scan-form"
      method="POST"
      action="{% url 'document_scan' %}"
      enctype="multipart/form-data"
      class="space-y-4"
    >
      {% csrf_token %}
      
      <label class="block">
        <span class="text-gray-700">Upload Document (PDF, JPG, PNG):</span>
        <input
          type="file"
          name="documents"
          accept=".pdf,.jpg,.jpeg,.png"
          multiple
          required
          class="mt-1 block w-full text-gray-700 border border-gray-300 rounded-md p-2"
        />
      </label>

      <label class="flex items-center space-x-2">
        <input
          type="checkbox"
          id="has-police-report"
          name="has_police_report"
          onchange="togglePoliceReportInput()"
          class="rounded"
        />
        <span class="text-gray-700">I have a police report to upload</span>
      </label>

      <div id="police-report-section" style="display: none;">
        <label class="block">
          <span class="text-gray-700">Upload Police Report (PDF, JPG, PNG):</span>
          <input
            type="file"
            name="police_reports"
            accept=".pdf,.jpg,.jpeg,.png"
            multiple
            class="mt-1 block w-full text-gray-700 border border-gray-300 rounded-md p-2"
          />
        </label>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition"
      >
        Scan for Fraud
      </button>
    </form>

    {% if messages %}
      <div class="mt-4">
        {% for message in messages %}
          <p class="text-red-500">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    {% if prediction %}
      <div class="mt-6 bg-gray-100 p-4 rounded-md space-y-2">
        <h2 class="text-xl font-semibold">
          Status:
          <span class="{% if prediction == 'Fraud' %}text-red-600{% else %}text-green-600{% endif %}">
            {{ prediction }}
          </span>
        </h2>
        <p>Reason: <strong>{{ reason }}</strong></p>
      </div>
    {% endif %}
  </div>
</body>
</html>
